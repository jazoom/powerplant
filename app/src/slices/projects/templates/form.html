<main
  data-section="projects"
  class="mx-auto flex w-full max-w-4xl flex-1 flex-col gap-6 px-5 py-8 sm:px-8"
>
  <div class="page-intro">
    <div>
      <h1>{{ title }}</h1>
      <p>{{ lead }}</p>
    </div>
  </div>
  <div id="project-form">
    {% block project_form %}
      <form
        data-graft
        method="post"
        action="{{ action }}"
        class="flex flex-col gap-4"
      >
        {% if error != "" %}
          <div class="alert alert-error" role="alert" tabindex="-1">
            <p>{{ error }}</p>
          </div>
        {% endif %}
        {% if revision != "" %}
          <input type="hidden" name="revision" value="{{ revision }}" />
        {% endif %}
        <label class="flex flex-col gap-1">
          <span class="text-sm">Name</span>
          <input
            class="input input-bordered"
            name="name"
            required
            maxlength="80"
            value="{{ name }}"
          />
        </label>
        {% if show_path %}
          <label class="flex flex-col gap-1">
            <span class="text-sm">Host path</span>
            <input
              class="input input-bordered font-mono"
              name="path"
              required
              maxlength="4096"
              value="{{ path }}"
            />
          </label>
        {% else %}
          <p class="text-quiet font-mono text-xs break-all">{{ host_path }}</p>
        {% endif %}
        <button class="btn btn-primary self-start" type="submit">
          {{ submit }}
        </button>
      </form>
    {% endblock %}
  </div>
</main>
