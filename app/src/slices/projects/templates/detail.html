<main
  data-section="projects"
  class="mx-auto flex w-full max-w-4xl flex-1 flex-col gap-8 px-5 py-8 sm:px-8"
>
  <div class="page-intro">
    <div>
      <h1>{{ name }}</h1>
      <p class="text-quiet font-mono text-xs break-all">{{ path }}</p>
    </div>
    <a
      href="/projects/{{ id }}/configuration"
      data-graft
      class="btn btn-primary btn-sm"
      >Rename</a
    >
  </div>

  {% if available %}
    <p>
      <span class="badge badge-success">Available</span>
    </p>
  {% else %}
    <div class="alert alert-warning" role="status">
      <p>
        This project path is not available on the host. The record stays in the
        catalogue.
      </p>
    </div>
  {% endif %}

  <p>
    <a href="/projects" data-graft class="link link-hover">All projects</a>
  </p>
</main>
