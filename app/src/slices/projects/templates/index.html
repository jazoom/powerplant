<main
  data-section="projects"
  class="mx-auto flex w-full max-w-4xl flex-1 flex-col gap-8 px-5 py-8 sm:px-8"
>
  <div class="page-intro">
    <div>
      <h1>Projects</h1>
      <p>Add an existing Git project from this machine.</p>
    </div>
    <a href="/projects/new" data-graft class="btn btn-primary btn-sm"
      >New project</a
    >
  </div>

  <ul class="record-list">
    {% for project in projects %}
      <li class="record-row">
        <div>
          <a
            href="/projects/{{ project.id }}"
            data-graft
            class="link link-hover font-medium"
            >{{ project.name }}</a
          >
          <p class="text-quiet font-mono text-xs break-all">
            {{ project.path }}
          </p>
        </div>
        <div class="flex flex-col items-end gap-1 text-right">
          {% if !project.available %}
            <span class="badge badge-sm badge-warning">Folder unavailable</span>
          {% endif %}
          <a
            href="/projects/{{ project.id }}/configuration"
            data-graft
            class="btn btn-ghost btn-sm"
            >Rename</a
          >
        </div>
      </li>
    {% endfor %}
  </ul>
</main>
