<main
  data-section="settings"
  class="mx-auto flex w-full max-w-4xl flex-1 flex-col gap-8 px-5 py-8 sm:px-8"
>
  <div class="page-intro">
    <div>
      <h1>Settings</h1>
      <p>Set preferences for your local desk.</p>
    </div>
  </div>

  <ol class="settings-list">
    <li class="settings-row">
      <form
        id="theme-setting"
        method="post"
        action="/settings/theme"
        data-graft
        data-island="theme-selector"
        class="contents"
      >
        {% include "settings/templates/theme.html" %}
      </form>
    </li>
    <li class="settings-row settings-row-danger">
      <form
        id="local-data-reset"
        method="post"
        action="/settings/local-data/reset"
        data-graft
        class="contents"
      >
        {% include "settings/templates/local_data.html" %}
      </form>
    </li>
  </ol>
</main>
