<main
  data-section="settings"
  class="mx-auto flex w-full max-w-4xl flex-1 flex-col gap-8 px-5 py-8 sm:px-8"
>
  <div class="page-intro">
    <div>
      <h1>Settings</h1>
      <p>Set browser preferences for your local desk.</p>
    </div>
  </div>

  <ol class="settings-list">
    <li class="settings-row" data-island="theme-selector">
      <div>
        <h2 id="theme-heading">Theme</h2>
        <p id="theme-description" class="text-quiet mt-1 max-w-[60ch] text-sm">
          Choose the colour theme for Power Plant. This browser remembers your
          choice.
        </p>
      </div>
      <div class="settings-control">
        <label class="label" for="theme-select">Current theme</label>
        <select
          id="theme-select"
          class="select"
          data-theme-select
          aria-describedby="theme-description"
        >
          <option value="springfield-light">Springfield light</option>
          <option value="springfield-dark">Springfield dark</option>
        </select>
      </div>
    </li>
  </ol>
</main>
