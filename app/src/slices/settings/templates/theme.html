<div data-active-theme="{{ theme }}">
  <h2 id="theme-heading">Theme</h2>
  <p id="theme-description" class="text-quiet mt-1 max-w-[60ch] text-sm">
    Choose the colour theme for Power Plant. Power Plant stores this choice on
    the local machine.
  </p>
  {% if let Some(message) = error %}
    <p class="text-error mt-2 text-sm" role="alert">{{ message }}</p>
  {% endif %}
</div>
<div class="settings-control">
  <label class="label" for="theme-select">Current theme</label>
  <select
    id="theme-select"
    name="theme"
    class="select"
    data-theme-select
    aria-describedby="theme-description"
  >
    {% for option in themes %}
      <option
        value="{{ option.as_str() }}"
        {% if theme == option.as_str() %}selected{% endif %}
      >
        {{ option.label() }}
      </option>
    {% endfor %}
  </select>
</div>
