<div
  class="prose max-w-none"
  {% if message.streaming %}data-streaming-text="conversation-message-{{ message.index }}"{% endif %}
>
  {{ message.html|safe }}
</div>
{% if message.status != "" %}
  <p class="text-quiet mt-2 text-xs">{{ message.status }}</p>
{% endif %}
{% if message.saveable_plan %}
  <form
    data-graft
    method="post"
    action="{{ message.plan_action }}"
    class="mt-3 flex flex-wrap items-end gap-2"
  >
    <input
      type="hidden"
      name="revision"
      value="{{ message.conversation_revision }}"
    />
    <input type="hidden" name="message_index" value="{{ message.index }}" />
    <label
      class="flex min-w-56 flex-1 flex-col gap-1"
      for="plan-title-{{ message.index }}"
    >
      <span class="sr-only">Plan title</span>
      <input
        id="plan-title-{{ message.index }}"
        class="input input-bordered input-sm"
        name="title"
        required
        maxlength="120"
        value="{{ message.plan_title }}"
      />
    </label>
    <button class="btn btn-secondary btn-sm" type="submit">Save as plan</button>
  </form>
{% endif %}
