<p class="recent-heading">Recent conversations</p>
<ul class="recent-list">
  {% for conversation in conversations %}
    <li>
      <a href="{{ conversation.href }}" data-graft data-recent-conversation>
        <strong>{{ conversation.title }}</strong>
        <span>{{ conversation.status }}</span>
      </a>
    </li>
  {% endfor %}
</ul>
{% if conversations.is_empty() %}<p class="recent-empty">
  Your conversations will appear here after the first message.
</p>{% endif %}
