<main
  data-section="runs"
  class="mx-auto flex w-full max-w-5xl flex-1 flex-col gap-6 px-5 py-8 sm:px-8"
>
  <p class="text-quiet text-sm">
    <a href="{{ run_href }}" data-graft class="link">Back to run</a>
  </p>
  <div class="page-intro">
    <div>
      <h1>{{ kind }}</h1>
      <p class="font-mono text-xs break-all">{{ hash }}</p>
    </div>
  </div>
  <p class="text-sm">{{ producer }}</p>
  <p class="text-quiet text-xs">{{ created }}</p>
  {% if constraint != "" %}
    <p class="text-sm">{{ constraint }}</p>
  {% endif %}
  <article class="prose max-w-none">{{ body|safe }}</article>
  {% if preview != "" %}
    <section class="space-y-2">
      <h2 class="text-base font-semibold">Preview</h2>
      {% if truncated %}
        <p class="text-quiet text-sm">This preview is truncated.</p>
      {% endif %}
      <pre
        class="border-base-300 overflow-x-auto rounded-sm border p-3 text-xs"
      >
{{ preview|safe }}</pre>
    </section>
  {% endif %}
</main>
