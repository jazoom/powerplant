[package]
name = "powerplant"
default-run = "powerplant"
version = "0.0.1"
edition = "2024"
publish = false

[features]
dev = ["dep:tower-livereload"]

[dependencies]
tower-livereload = { version = "0.10.3", optional = true }
askama = "0.16.0"
axum = "0.8.9"
hypergraft = { path = "../../hypergraft" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
cookie = "0.18.2"
base64 = "0.23.1"
sha2 = "0.11.0"
serde_json = "1.0.151"
url = "2.5.8"
ammonia = "4.1.4"
pulldown-cmark = "0.13.4"
rig-core = "0.42.0"
rand = { version = "0.10.2", default-features = false, features = ["sys_rng"] }
time = { version = "0.3.55", features = ["formatting"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
futures-util = "0.3.34"
microsandbox = "0.6.15"
similar = "3.2.0"
cap-std = "4.0.3"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
